    // =========================================================================

    const STORAGE_KEY = 'kseab_chem_quiz_v1';

    function loadStats() {
      const fallback = {
        totalAnswered: 0,
        totalCorrect: 0,
        bestMockScore: null,
        chapterStats: {}
      };
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return { ...fallback, ...parsed, chapterStats: parsed.chapterStats || {} };
      } catch (e) {
        return fallback;
      }
    }

    function saveStats() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.stats));
      } catch (e) {
        // Ignore storage errors in restricted environments
      }
    }

    function getChapter(id) {
      return CHAPTERS.find(c => c.id === id) || CHAPTERS[0];

    function branchBadgeClass(branch) {
      if (branch === 'Physical') return 'bg-sky-100 text-sky-800 border-sky-200';
      if (branch === 'Inorganic') return 'bg-amber-100 text-amber-800 border-amber-200';
      return 'bg-emerald-100 text-emerald-800 border-emerald-200';
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function normalizeText(str) {
      return String(str || '').trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function isQuestionCorrect(q, userAns) {
      if (userAns === undefined || userAns === null || userAns === '') return false;
      if (q.type === 'mcq') return Number(userAns) === q.answer;
      const norm = normalizeText(userAns);
      return q.accepted.some(acc => normalizeText(acc) === norm);
    }

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    function openModal({ title, body, confirmText = 'Confirm', confirmClass = 'bg-indigo-600 hover:bg-indigo-700', onConfirm }) {
      const backdrop = document.getElementById('modal-backdrop');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      const confirmBtn = document.getElementById('modal-confirm');
      confirmBtn.textContent = confirmText;
      confirmBtn.className = `px-4 py-2 rounded-xl text-sm font-semibold text-white transition-colors ${confirmClass}`;

      const cleanup = () => {
        backdrop.classList.add('hidden');
        confirmBtn.onclick = null;
        document.getElementById('modal-cancel').onclick = null;
      };

      document.getElementById('modal-cancel').onclick = cleanup;
      confirmBtn.onclick = () => {
        cleanup();
        if (onConfirm) onConfirm();
      };
      backdrop.classList.remove('hidden');
    }

    function stopQuizTimer() {
      if (state.quiz && state.quiz.timerId) {
        clearInterval(state.quiz.timerId);
        state.quiz.timerId = null;
      }
    }

    // 6. VIEW ROUTER
    // =========================================================================
    function switchView(viewName) {
      if (state.view === 'quiz' && viewName !== 'quiz' && state.quiz && !state.quiz.submitted) {
        openModal({
          title: 'Leave active quiz?',
          body: 'Your current quiz progress will be lost if you switch views without submitting.',
          confirmText: 'Leave Quiz',
          confirmClass: 'bg-rose-600 hover:bg-rose-700',
          onConfirm: () => {
            stopQuizTimer();
            state.quiz = null;
            applyView(viewName);
          }
        });
        return;
      }
      applyView(viewName);
    }

    function applyView(viewName) {
      state.view = viewName;
      ['dashboard', 'quiz', 'results', 'flashcards', 'blueprint'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (v === viewName) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });

      document.querySelectorAll('.nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        const active = target === viewName || (viewName === 'results' && target === 'dashboard');
        btn.className = active
          ? 'nav-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap bg-indigo-50 text-indigo-700'
          : 'nav-btn px-2.5 sm:px-3 py-1.5 rounded-lg text-xs sm:text-sm font-medium whitespace-nowrap text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors';
      });

      if (viewName === 'dashboard') renderDashboard();
      else if (viewName === 'quiz') renderQuiz();
      else if (viewName === 'results') renderResults();
      else if (viewName === 'flashcards') renderFlashcards();
      else if (viewName === 'blueprint') renderBlueprint();
    }

                </select>
                <button id="btn-start-custom" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors shrink-0">

                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 10-Chapter Blueprint Grid -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-base font-bold text-slate-900">10 Syllabus Chapters (KSEAB 2026–27)</h3>
            <span class="text-xs text-slate-500">${filteredChapters.length} shown</span>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            ${filteredChapters.map(ch => {
              const st = chapterStats[ch.id] || { attempted: 0, correct: 0 };
              const acc = st.attempted > 0 ? Math.round((st.correct / st.attempted) * 100) : 0;
              return `
                <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs flex flex-col justify-between gap-3 hover:border-indigo-300 transition-colors">
                  <div class="flex items-start justify-between gap-3">
                    <div class="space-y-1">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-xs font-bold text-slate-400">UNIT ${ch.id}</span>
                        <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold border ${branchBadgeClass(ch.branch)}">${ch.branch}</span>
                      </div>
                      <h4 class="text-sm sm:text-base font-bold text-slate-900">${ch.name}</h4>
                    </div>
                    <div class="text-right shrink-0">
                      <span class="inline-block px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs font-bold">${ch.marks} Marks</span>
                      <p class="text-[11px] text-slate-400 mt-0.5">${ch.hours} hrs</p>
                    </div>
                  </div>
                  <div class="flex items-center justify-between gap-4 pt-1">
                    <div class="flex-1">
                      <div class="flex items-center justify-between text-xs mb-1">
                        <span class="text-slate-500">${st.attempted > 0 ? `${st.correct}/${st.attempted} correct` : 'Not attempted'}</span>
                        <span class="font-semibold text-slate-700">${st.attempted > 0 ? acc + '%' : '0%'}</span>
                      </div>
                      <div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full bg-indigo-600 rounded-full transition-all" style="width: ${acc}%"></div>
                      </div>
                    </div>
                    <button data-chapter-start="${ch.id}" class="px-3.5 py-1.5 rounded-xl bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold transition-colors shrink-0">
                      Practice
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Attach listeners
      document.getElementById('btn-start-mock').addEventListener('click', startPartAMock);
      document.getElementById('filter-branch').addEventListener('change', (e) => {
        state.filters.branch = e.target.value;
        state.filters.chapterId = 'all';
        renderDashboard();
      });
      document.getElementById('filter-chapter').addEventListener('change', (e) => {
        state.filters.chapterId = e.target.value;
      });
      document.getElementById('filter-type').addEventListener('change', (e) => {
        state.filters.qType = e.target.value;
      });
      document.getElementById('filter-count').addEventListener('change', (e) => {
        state.filters.count = Number(e.target.value);
      });
      document.getElementById('btn-start-custom').addEventListener('click', startCustomQuiz);

      container.querySelectorAll('[data-chapter-start]').forEach(btn => {
        btn.addEventListener('click', () => {
          const chId = Number(btn.getAttribute('data-chapter-start'));
          startChapterQuiz(chId);
        });
      });
    }

    // =========================================================================
    // 8. QUIZ LAUNCHERS
    // =========================================================================
    function startPartAMock() {
      // Authentic KSEAB Part A: 15 MCQs + 5 Fill-in-the-Blanks = 20 Marks, 20 minutes
      const mcqs = shuffleArray(QUESTIONS.filter(q => q.type === 'mcq')).slice(0, 15);
      const fibs = shuffleArray(QUESTIONS.filter(q => q.type === 'fib')).slice(0, 5);
      const combined = [...mcqs, ...fibs];
      launchQuiz({
        mode: 'mock',
        title: 'KSEAB Part A Mock Test (15 MCQs + 5 Fill-in-the-Blanks)',
        questions: combined,
        durationSec: 20 * 60
      });
    }

    function startChapterQuiz(chapterId) {
      const ch = getChapter(chapterId);
      const qs = shuffleArray(QUESTIONS.filter(q => q.chapterId === chapterId));
      launchQuiz({
        mode: 'practice',
        title: `Unit ${ch.id}: ${ch.name}`,
        questions: qs,
        durationSec: 0
      });
    }

    function startCustomQuiz() {
      let pool = [...QUESTIONS];
      if (state.filters.branch !== 'All') {
        const validIds = new Set(CHAPTERS.filter(c => c.branch === state.filters.branch).map(c => c.id));
        pool = pool.filter(q => validIds.has(q.chapterId));
      }
      if (state.filters.chapterId !== 'all') {
        pool = pool.filter(q => q.chapterId === Number(state.filters.chapterId));
      }
      if (state.filters.qType !== 'all') {
        pool = pool.filter(q => q.type === state.filters.qType);
      }
      if (pool.length === 0) {
        showToast('No questions match your current filters.');
        return;
      }
      const selected = shuffleArray(pool).slice(0, state.filters.count);
      const title = state.filters.chapterId !== 'all'
        ? `Practice: ${getChapter(Number(state.filters.chapterId)).name}`
        : state.filters.branch !== 'All'
          ? `${state.filters.branch} Chemistry Practice`
          : 'Custom Chemistry Practice';

      launchQuiz({
        mode: 'practice',
        title,
        questions: selected,
        durationSec: 0
      });
    }

    function launchQuiz({ mode, title, questions, durationSec }) {
      stopQuizTimer();
      state.quiz = {
        mode,
        title,
        questions,
        index: 0,
        answers: {},
        checked: {},
        flagged: {},
        startTime: Date.now(),
        durationSec,
        remainingSec: durationSec,
        elapsedSec: 0,
        submitted: false,
        timerId: null
      };

      state.quiz.timerId = setInterval(() => {
        if (!state.quiz || state.quiz.submitted) return;
        if (state.quiz.mode === 'mock') {
          state.quiz.remainingSec -= 1;
          const timerEl = document.getElementById('quiz-timer');
          if (timerEl) {
            timerEl.textContent = formatTime(state.quiz.remainingSec);
            if (state.quiz.remainingSec <= 120) {
              timerEl.classList.add('text-rose-600');
            }
          }
          if (state.quiz.remainingSec <= 0) {
            showToast('Time is up! Submitting your Part A Mock.');
            submitQuiz();
          }
        } else {
          state.quiz.elapsedSec += 1;
          const timerEl = document.getElementById('quiz-timer');
          if (timerEl) timerEl.textContent = formatTime(state.quiz.elapsedSec);
        }
      }, 1000);

      applyView('quiz');
    }

    // =========================================================================
    // 9. ACTIVE QUIZ VIEW
    // =========================================================================
    function renderQuiz() {
      const container = document.getElementById('view-quiz');
      const quiz = state.quiz;
      if (!quiz) return;

      const q = quiz.questions[quiz.index];
      const ch = getChapter(q.chapterId);
      const userAns = quiz.answers[q.id];
      const isChecked = !!quiz.checked[q.id];
      const isFlagged = !!quiz.flagged[q.id];
      const answeredCount = Object.keys(quiz.answers).filter(id => {
        const val = quiz.answers[id];
        return val !== undefined && val !== null && String(val).trim() !== '';
      }).length;

      const timerText = quiz.mode === 'mock' ? formatTime(quiz.remainingSec) : formatTime(quiz.elapsedSec);

      container.innerHTML = `
        <!-- Quiz Top Bar -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs flex flex-wrap items-center justify-between gap-3">
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded-md text-[11px] font-bold uppercase ${quiz.mode === 'mock' ? 'bg-amber-100 text-amber-800' : 'bg-indigo-100 text-indigo-800'}">
                ${quiz.mode === 'mock' ? 'Exam Mode' : 'Practice Mode'}
              </span>
              <span class="text-xs text-slate-500">Question ${quiz.index + 1} of ${quiz.questions.length}</span>
            </div>
            <h2 class="text-sm sm:text-base font-bold text-slate-900 truncate mt-0.5">${quiz.title}</h2>
          </div>

          <div class="flex items-center gap-3">

              <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <span id="quiz-timer">${timerText}</span>
            </div>
            <button id="btn-submit-quiz" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold transition-colors">
              ${quiz.mode === 'mock' ? 'Submit Test' : 'Finish Quiz'}
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
          <!-- Question Card -->
          <div class="lg:col-span-8 bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-2xs space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${branchBadgeClass(ch.branch)}">Unit ${ch.id}: ${ch.name}</span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">${q.type === 'mcq' ? 'MCQ · 1 Mark' : 'Fill in the Blank · 1 Mark'}</span>
              </div>
              <button id="btn-flag-q" class="px-3 py-1 rounded-lg text-xs font-semibold border transition-colors ${isFlagged ? 'bg-amber-50 border-amber-300 text-amber-700' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">
                ${isFlagged ? 'Flagged' : 'Flag for Review'}
              </button>
            </div>

            <p class="chem text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">${q.prompt}</p>

            ${q.type === 'mcq' ? renderMcqOptions(q, userAns, isChecked) : renderFibInput(q, userAns, isChecked)}

            <!-- Instant Explanation in Practice Mode -->
            ${isChecked ? renderFeedbackBox(q, userAns) : ''}

            <!-- Footer Controls -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100">
              <div class="flex items-center gap-2">
                <button id="btn-prev-q" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-40" ${quiz.index === 0 ? 'disabled' : ''}>
                  Previous
                </button>
                <button id="btn-next-q" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold disabled:opacity-40" ${quiz.index === quiz.questions.length - 1 ? 'disabled' : ''}>
                  Next
                </button>
              </div>
              ${quiz.mode === 'practice' && !isChecked ? `
                <button id="btn-check-q" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors">
                  Check Answer
                </button>
              ` : ''}
            </div>
          </div>

          <!-- Question Palette -->
          <div class="lg:col-span-4 bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-2xs space-y-4">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-bold text-slate-900">Question Palette</h3>
              <span class="text-xs font-semibold text-slate-500">${answeredCount}/${quiz.questions.length} answered</span>
            </div>
            <div class="grid grid-cols-5 gap-2">
              ${quiz.questions.map((item, idx) => {
                const ans = quiz.answers[item.id];
                const hasAns = ans !== undefined && ans !== null && String(ans).trim() !== '';
                const checked = !!quiz.checked[item.id];
                const flagged = !!quiz.flagged[item.id];
                const isCur = idx === quiz.index;

                let cls = 'bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200';
                if (checked) {
                  cls = isQuestionCorrect(item, ans)
                    ? 'bg-emerald-100 text-emerald-800 border-emerald-300'
                    : 'bg-rose-100 text-rose-800 border-rose-300';
                } else if (flagged) {
                  cls = 'bg-amber-100 text-amber-800 border-amber-300';
                } else if (hasAns) {
                  cls = 'bg-indigo-600 text-white border-indigo-600';
                }

                if (isCur) cls += ' ring-2 ring-indigo-500 ring-offset-1';

                return `<button data-jump-q="${idx}" class="h-9 rounded-lg text-xs font-bold border transition-all ${cls}">${idx + 1}</button>`;
              }).join('')}
            </div>
            <div class="text-[11px] text-slate-500 space-y-1 pt-2 border-t border-slate-100">
              <p>Shortcuts: <span class="font-semibold text-slate-700">1–4</span> select option · <span class="font-semibold text-slate-700">← / →</span> navigate · <span class="font-semibold text-slate-700">F</span> flag</p>
            </div>
          </div>
        </div>
      `;

      // Event Listeners
      if (q.type === 'mcq') {
        container.querySelectorAll('[data-opt-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (quiz.checked[q.id]) return;
            quiz.answers[q.id] = Number(btn.getAttribute('data-opt-idx'));
            renderQuiz();
          });
        });
      } else {
        const input = document.getElementById('fib-input');
        if (input) {
          input.addEventListener('input', (e) => {
            quiz.answers[q.id] = e.target.value;
          });
        }
        container.querySelectorAll('[data-fib-hint]').forEach(chip => {
          chip.addEventListener('click', () => {
            if (quiz.checked[q.id]) return;
            const val = chip.getAttribute('data-fib-hint');
            quiz.answers[q.id] = val;
            renderQuiz();
          });
        });
      }

      document.getElementById('btn-flag-q').addEventListener('click', () => {
        quiz.flagged[q.id] = !quiz.flagged[q.id];
        renderQuiz();
      });

      document.getElementById('btn-prev-q').addEventListener('click', () => {
        if (quiz.index > 0) {
          quiz.index -= 1;
          renderQuiz();
        }
      });

      document.getElementById('btn-next-q').addEventListener('click', () => {
        if (quiz.index < quiz.questions.length - 1) {
          quiz.index += 1;
          renderQuiz();
        }
      });

      const checkBtn = document.getElementById('btn-check-q');
      if (checkBtn) {
        checkBtn.addEventListener('click', () => {
          const val = quiz.answers[q.id];
          if (val === undefined || val === null || String(val).trim() === '') {
            showToast('Select or enter an answer first.');
            return;
          }
          quiz.checked[q.id] = true;
          renderQuiz();
        });
      }

      container.querySelectorAll('[data-jump-q]').forEach(btn => {
        btn.addEventListener('click', () => {
          quiz.index = Number(btn.getAttribute('data-jump-q'));
          renderQuiz();
        });
      });

      document.getElementById('btn-submit-quiz').addEventListener('click', () => {
        const unanswered = quiz.questions.length - answeredCount;
        if (unanswered > 0) {
          openModal({
            title: 'Submit Quiz?',
            body: `You have ${unanswered} unanswered question${unanswered > 1 ? 's' : ''}. Do you want to submit now?`,
            confirmText: 'Submit',
            onConfirm: submitQuiz
          });
        } else {
          submitQuiz();
        }
      });
    }

    function renderMcqOptions(q, userAns, isChecked) {
      const letters = ['A', 'B', 'C', 'D'];
      return `
        <div class="space-y-2.5">
          ${q.options.map((opt, idx) => {
            const selected = Number(userAns) === idx;
            const isRight = idx === q.answer;
            let cls = 'border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/40';
            if (isChecked) {
              if (isRight) cls = 'border-emerald-500 bg-emerald-50 text-emerald-950';
              else if (selected && !isRight) cls = 'border-rose-500 bg-rose-50 text-rose-950';
              else cls = 'border-slate-200 bg-slate-50 opacity-75';
            } else if (selected) {
              cls = 'border-indigo-600 bg-indigo-50 ring-1 ring-indigo-600';
            }
            return `
              <button data-opt-idx="${idx}" ${isChecked ? 'disabled' : ''} class="w-full text-left px-4 py-3 rounded-xl border transition-all flex items-center gap-3 ${cls}">
                <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 ${selected || (isChecked && isRight) ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'} ${isChecked && isRight ? '!bg-emerald-600' : ''} ${isChecked && selected && !isRight ? '!bg-rose-600' : ''}">
                  ${letters[idx]}
                </span>
                <span class="chem text-sm sm:text-base font-medium">${opt}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderFibInput(q, userAns, isChecked) {
      const val = userAns || '';
      const correct = isQuestionCorrect(q, val);
      const borderCls = isChecked
        ? (correct ? 'border-emerald-500 bg-emerald-50' : 'border-rose-500 bg-rose-50')
        : 'border-slate-300 focus:ring-2 focus:ring-indigo-500';
      return `
        <div class="space-y-3">
          <input id="fib-input" type="text" value="${val.replace(/"/g, '&quot;')}" ${isChecked ? 'disabled' : ''} placeholder="Type your answer here..." class="w-full rounded-xl border px-4 py-3 text-sm sm:text-base font-medium focus:outline-none ${borderCls}" />
          <div class="space-y-1.5">
            <p class="text-xs font-semibold text-slate-500">Quick-pick word bank (optional):</p>
            <div class="flex flex-wrap gap-2">
              ${q.hints.map(h => `
                <button type="button" data-fib-hint="${h}" ${isChecked ? 'disabled' : ''} class="px-3 py-1 rounded-lg text-xs font-medium border border-slate-200 bg-slate-50 hover:bg-indigo-50 hover:border-indigo-300 text-slate-700 transition-colors">
                  ${h}
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderFeedbackBox(q, userAns) {
      const ok = isQuestionCorrect(q, userAns);
      const correctText = q.type === 'mcq' ? q.options[q.answer] : q.accepted[0];
      return `
        <div class="rounded-xl p-4 border ${ok ? 'bg-emerald-50 border-emerald-200 text-emerald-950' : 'bg-rose-50 border-rose-200 text-rose-950'} space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wide">${ok ? 'Correct Answer' : 'Incorrect'}</span>
            ${!ok ? `<span class="chem text-xs font-semibold">Correct: ${correctText}</span>` : ''}
          </div>
          <p class="chem text-sm leading-relaxed">${q.explanation}</p>
        </div>
      `;
    }

    // =========================================================================
    // 10. SUBMIT & RESULTS VIEW
    // =========================================================================
    function submitQuiz() {
      const quiz = state.quiz;
      if (!quiz) return;
      stopQuizTimer();
      quiz.submitted = true;

      let score = 0;
      quiz.questions.forEach(q => {
        const ans = quiz.answers[q.id];
        const ok = isQuestionCorrect(q, ans);
        if (ok) score += 1;

        state.stats.totalAnswered += 1;
        if (ok) state.stats.totalCorrect += 1;

        if (!state.stats.chapterStats[q.chapterId]) {
          state.stats.chapterStats[q.chapterId] = { attempted: 0, correct: 0 };
        }
        state.stats.chapterStats[q.chapterId].attempted += 1;
        if (ok) state.stats.chapterStats[q.chapterId].correct += 1;
      });

      if (quiz.mode === 'mock') {
        if (state.stats.bestMockScore === null || score > state.stats.bestMockScore) {
          state.stats.bestMockScore = score;
        }
      }
      saveStats();

      quiz.finalScore = score;
      quiz.timeSpentSec = quiz.mode === 'mock'
        ? (quiz.durationSec - Math.max(0, quiz.remainingSec))
        : quiz.elapsedSec;
      state.resultsFilter = 'all';
      applyView('results');
    }

    function renderResults() {
      const container = document.getElementById('view-results');
      const quiz = state.quiz;
      if (!quiz) return;

      const total = quiz.questions.length;
      const score = quiz.finalScore;
      const pct = total > 0 ? Math.round((score / total) * 100) : 0;

      // Branch accuracy
      const branches = ['Physical', 'Inorganic', 'Organic'];
      const branchSummary = branches.map(b => {
        const qs = quiz.questions.filter(q => getChapter(q.chapterId).branch === b);
        const right = qs.filter(q => isQuestionCorrect(q, quiz.answers[q.id])).length;
        return { branch: b, total: qs.length, right, pct: qs.length > 0 ? Math.round((right / qs.length) * 100) : 0 };
      }).filter(x => x.total > 0);

      const incorrectQs = quiz.questions.filter(q => !isQuestionCorrect(q, quiz.answers[q.id]));

      let reviewList = quiz.questions;
      if (state.resultsFilter === 'incorrect') reviewList = incorrectQs;
      else if (state.resultsFilter === 'flagged') reviewList = quiz.questions.filter(q => quiz.flagged[q.id]);

      container.innerHTML = `
        <!-- Score Hero -->
        <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-2xs flex flex-col md:flex-row md:items-center md:justify-between gap-5">
          <div class="space-y-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">${quiz.mode === 'mock' ? 'Part A Mock Results' : 'Practice Summary'}</span>
            <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900">${score} / ${total} <span class="text-lg font-semibold text-slate-500">(${pct}%)</span></h2>
            <p class="text-sm text-slate-600">Completed in <span class="font-semibold text-slate-800">${formatTime(quiz.timeSpentSec)}</span> · ${quiz.title}</p>
          </div>
          <div class="flex flex-wrap gap-2.5">
            ${incorrectQs.length > 0 ? `
              <button id="btn-retry-wrong" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-sm font-semibold transition-colors">
                Retry ${incorrectQs.length} Incorrect
              </button>
            ` : ''}
            <button id="btn-back-dash" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold transition-colors">
              Back to Dashboard
            </button>
          </div>
        </div>

        <!-- Branch Performance Chart -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-3">
          <h3 class="text-base font-bold text-slate-900">Performance by Chemistry Branch</h3>
          <div class="relative h-56">
            <canvas id="results-chart"></canvas>
          </div>
        </div>

        <!-- Question-by-Question Review -->
        <div class="space-y-3">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="text-base font-bold text-slate-900">Detailed Review</h3>
            <div class="flex items-center gap-1.5">
              ${['all', 'incorrect', 'flagged'].map(f => `
                <button data-res-filter="${f}" class="px-3 py-1 rounded-lg text-xs font-semibold capitalize transition-colors ${state.resultsFilter === f ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                  ${f}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="space-y-3">
            ${reviewList.length === 0 ? `<div class="bg-white rounded-2xl p-6 border border-slate-200 text-sm text-slate-500 text-center">No questions in this filter.</div>` : reviewList.map((q, idx) => {
              const ch = getChapter(q.chapterId);
              const ans = quiz.answers[q.id];
              const ok = isQuestionCorrect(q, ans);
              const userText = q.type === 'mcq'
                ? (ans !== undefined ? q.options[ans] : 'Not answered')
                : (ans && String(ans).trim() !== '' ? ans : 'Not answered');
              const correctText = q.type === 'mcq' ? q.options[q.answer] : q.accepted[0];

              return `
                <div class="bg-white rounded-2xl p-5 border ${ok ? 'border-emerald-200' : 'border-rose-200'} shadow-2xs space-y-2.5">
                  <div class="flex items-center justify-between gap-2 flex-wrap">
                    <span class="text-xs font-semibold text-slate-500">Unit ${ch.id}: ${ch.name}</span>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${ok ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                      ${ok ? 'Correct (+1)' : 'Incorrect (0)'}
                    </span>
                  </div>
                  <p class="chem text-sm sm:text-base font-semibold text-slate-900">${q.prompt}</p>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs sm:text-sm pt-1">
                    <div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200">
                      <span class="text-slate-500 font-medium">Your answer:</span>
                      <span class="chem font-semibold ${ok ? 'text-emerald-700' : 'text-rose-700'} ml-1">${userText}</span>
                    </div>
                    <div class="p-2.5 rounded-xl bg-emerald-50 border border-emerald-200">
                      <span class="text-emerald-700 font-medium">Correct answer:</span>
                      <span class="chem font-semibold text-emerald-900 ml-1">${correctText}</span>
                    </div>
                  </div>
                  <p class="chem text-xs sm:text-sm text-slate-600 leading-relaxed pt-1">${q.explanation}</p>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Render Chart.js
      if (state.charts.results) state.charts.results.destroy();
      const ctx = document.getElementById('results-chart').getContext('2d');
      state.charts.results = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: branchSummary.map(b => `${b.branch} (${b.right}/${b.total})`),
          datasets: [{
            label: 'Accuracy (%)',
            data: branchSummary.map(b => b.pct),
            backgroundColor: ['#0284c7', '#d97706', '#059669'],
            borderRadius: 8,
            maxBarThickness: 44
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } }
          },
          plugins: { legend: { display: false } }
        }
      });

      const retryBtn = document.getElementById('btn-retry-wrong');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          launchQuiz({
            mode: 'practice',
            title: 'Retry Incorrect Questions',
            questions: shuffleArray(incorrectQs),
            durationSec: 0
          });
        });
      }

      document.getElementById('btn-back-dash').addEventListener('click', () => {
        state.quiz = null;
        applyView('dashboard');
      });

      container.querySelectorAll('[data-res-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.resultsFilter = btn.getAttribute('data-res-filter');
          renderResults();
        });
      });
    }

    // =========================================================================
    // 11. FLASHCARDS VIEW
    // =========================================================================
    function renderFlashcards() {
      const container = document.getElementById('view-flashcards');
      const fc = state.flashcards;

      const filtered = fc.order
        .map(idx => FLASHCARDS[idx])
        .filter(card => fc.chapterId === 'all' || card.chapterId === Number(fc.chapterId));

      if (fc.index >= filtered.length) fc.index = 0;
      const card = filtered[fc.index];
      const ch = getChapter(card.chapterId);
      const isKnown = fc.known.has(card.id);

      container.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
          <div>
            <h2 class="text-xl font-extrabold text-slate-900">Formula &amp; Reaction Flashcards</h2>
            <p class="text-xs sm:text-sm text-slate-500">Tap the card to flip between prompt and high-yield KSEAB answer.</p>
          </div>
          <div class="flex items-center gap-2">
            <select id="fc-chapter-filter" class="rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <option value="all" ${fc.chapterId === 'all' ? 'selected' : ''}>All 10 Chapters (${FLASHCARDS.length})</option>
              ${CHAPTERS.map(c => `<option value="${c.id}" ${String(fc.chapterId) === String(c.id) ? 'selected' : ''}>${c.id}. ${c.name}</option>`).join('')}
            </select>
            <button id="btn-fc-shuffle" class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-sm font-medium text-slate-700">
              Shuffle
            </button>
          </div>
        </div>

        <div class="max-w-2xl mx-auto space-y-4">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-500">
            <span>Card ${fc.index + 1} of ${filtered.length}</span>
            <span>${fc.known.size} marked as mastered</span>
          </div>

          <!-- Flip Card -->
          <div id="fc-card-box" class="perspective-1000 cursor-pointer select-none">
            <div class="preserve-3d relative min-h-[260px] sm:min-h-[290px] ${fc.flipped ? 'rotate-y-180' : ''}">
              <!-- Front -->
              <div class="backface-hidden absolute inset-0 bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between gap-2">
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${branchBadgeClass(ch.branch)}">Unit ${ch.id}: ${ch.name}</span>
                  ${isKnown ? '<span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">Mastered</span>' : ''}
                </div>
                <div class="text-center space-y-2 my-auto py-4">
                  <p class="text-xs font-bold uppercase tracking-wider text-indigo-600">Concept / Formula</p>
                  <h3 class="chem text-xl sm:text-2xl font-extrabold text-slate-900">${card.front}</h3>
                </div>
                <p class="text-center text-xs text-slate-400">Click card to reveal answer</p>
              </div>

              <!-- Back -->
              <div class="backface-hidden rotate-y-180 absolute inset-0 bg-indigo-950 text-white rounded-2xl p-6 sm:p-8 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-semibold text-indigo-300">Unit ${ch.id}: ${ch.name}</span>
                  <span class="text-xs font-bold uppercase tracking-wider text-indigo-300">Key Takeaway</span>
                </div>
                <div class="my-auto py-4 text-center">
                  <p class="chem text-base sm:text-lg font-medium leading-relaxed text-indigo-50">${card.back}</p>
                </div>
                <p class="text-center text-xs text-indigo-300">Click card to flip back</p>
              </div>
            </div>
          </div>

          <!-- Controls -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-2">
              <button id="btn-fc-prev" class="px-4 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-sm font-medium text-slate-700">Previous</button>
              <button id="btn-fc-next" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-sm font-semibold">Next</button>
            </div>
            <button id="btn-fc-known" class="px-4 py-2 rounded-xl text-sm font-semibold border transition-colors ${isKnown ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-white border-slate-200 text-slate-700 hover:bg-emerald-50'}">
              ${isKnown ? 'Mastered ✓' : 'Mark as Mastered'}
            </button>
          </div>
        </div>
      `;

      document.getElementById('fc-chapter-filter').addEventListener('change', (e) => {
        fc.chapterId = e.target.value;
        fc.index = 0;
        fc.flipped = false;
        renderFlashcards();
      });
      document.getElementById('btn-fc-shuffle').addEventListener('click', () => {
        fc.order = shuffleArray(FLASHCARDS.map((_, i) => i));
        fc.index = 0;
        fc.flipped = false;
        renderFlashcards();
      });
      document.getElementById('fc-card-box').addEventListener('click', () => {
        fc.flipped = !fc.flipped;
        renderFlashcards();
      });
      document.getElementById('btn-fc-prev').addEventListener('click', () => {
        fc.index = (fc.index - 1 + filtered.length) % filtered.length;
        fc.flipped = false;
        renderFlashcards();
      });
      document.getElementById('btn-fc-next').addEventListener('click', () => {
        fc.index = (fc.index + 1) % filtered.length;
        fc.flipped = false;
        renderFlashcards();
      });
      document.getElementById('btn-fc-known').addEventListener('click', () => {
        if (fc.known.has(card.id)) fc.known.delete(card.id);
        else fc.known.add(card.id);
        renderFlashcards();
      });
    }

    // =========================================================================
    // 12. BLUEPRINT VIEW
    // =========================================================================
    function renderBlueprint() {
      const container = document.getElementById('view-blueprint');
      container.innerHTML = `
        <div class="space-y-1">
          <h2 class="text-xl font-extrabold text-slate-900">KSEAB 2nd PUC Chemistry Blueprint (2026–27)</h2>
          <p class="text-sm text-slate-500">Subject Code 34 · 70 Marks Theory (3 Hours, 46 Questions) + 30 Marks Practical (2 Hours)</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <!-- Paper Pattern Table -->
          <div class="lg:col-span-7 bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-3">
            <h3 class="text-base font-bold text-slate-900">Theory Question Paper Pattern (70 Marks)</h3>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm">
                <thead>
                  <tr class="border-b border-slate-200 text-xs uppercase text-slate-500">
                    <th class="py-2 pr-3">Part</th>
                    <th class="py-2 pr-3">Questions &amp; Choice</th>
                    <th class="py-2 text-right">Marks</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${PAPER_PATTERN.map(p => `
                    <tr>
                      <td class="py-2.5 pr-3 font-bold text-indigo-700 whitespace-nowrap">${p.part}</td>
                      <td class="py-2.5 pr-3 text-slate-700">${p.structure}</td>
                      <td class="py-2.5 text-right font-bold text-slate-900">${p.totalMarks}</td>
                    </tr>
                  `).join('')}
                  <tr class="bg-slate-50 font-bold">
                    <td class="py-2.5 pr-3">Total</td>
                    <td class="py-2.5 pr-3 text-slate-600">Blueprint sets 105 marks with choice; answer 70 marks</td>
                    <td class="py-2.5 text-right text-indigo-700">70</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Branch & Chapter Marks Chart -->
          <div class="lg:col-span-5 bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-3">
            <h3 class="text-base font-bold text-slate-900">Marks by Branch (105 Blueprint Total)</h3>
            <div class="relative h-60">
              <canvas id="blueprint-chart"></canvas>
            </div>
          </div>
        </div>

        <!-- Practical & Deleted Chapters -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-2xs space-y-2.5">
            <h3 class="text-base font-bold text-slate-900">Practical Exam Breakdown (30 Marks · 2 Hours)</h3>
            <ul class="text-sm text-slate-700 space-y-1.5 list-disc list-inside">
              <li><span class="font-semibold">Salt Analysis (10 marks):</span> Preliminary tests, acid &amp; basic radicals, confirmatory tests.</li>
              <li><span class="font-semibold">Volumetric Titration (10 marks):</span> Molarity of KMnO<sub>4</sub> using standard 0.1 M FAS (Mohr’s salt).</li>
              <li><span class="font-semibold">Attendance ≥75% (5 marks)</span> &amp; <span class="font-semibold">Certified Practical Record (5 marks)</span>.</li>
            </ul>
          </div>

          <div class="bg-rose-50/70 rounded-2xl p-5 border border-rose-200 space-y-2.5">
            <h3 class="text-base font-bold text-rose-950">Excluded Chapters (Not in 2026–27 Blueprint)</h3>
            <p class="text-xs text-rose-800">Skip these 6 older-syllabus chapters when revising from older guides:</p>
            <div class="flex flex-wrap gap-2 pt-1">
              ${DELETED_CHAPTERS.map(d => `<span class="px-2.5 py-1 rounded-lg bg-white border border-rose-200 text-xs font-semibold text-rose-800">${d}</span>`).join('')}
            </div>
          </div>
        </div>
      `;

      if (state.charts.blueprint) state.charts.blueprint.destroy();
      const ctx = document.getElementById('blueprint-chart').getContext('2d');
      state.charts.blueprint = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Physical (37 marks)', 'Inorganic (21 marks)', 'Organic (47 marks)'],
          datasets: [{
            data: [37, 21, 47],
            backgroundColor: ['#0284c7', '#d97706', '#059669'],
            borderWidth: 2,
            borderColor: '#ffffff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: 'bottom' }
          }
        }
      });
    }

    // =========================================================================
    // 13. GLOBAL KEYBOARD SHORTCUTS & INIT
    // =========================================================================
    document.addEventListener('keydown', (e) => {
      if (state.view !== 'quiz' || !state.quiz || state.quiz.submitted) return;
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

      const quiz = state.quiz;
      const q = quiz.questions[quiz.index];

      if (e.key === 'ArrowRight') {
        if (quiz.index < quiz.questions.length - 1) {
          quiz.index += 1;
          renderQuiz();
        }
      } else if (e.key === 'ArrowLeft') {
        if (quiz.index > 0) {
          quiz.index -= 1;
          renderQuiz();
        }
      } else if (e.key.toLowerCase() === 'f') {
        quiz.flagged[q.id] = !quiz.flagged[q.id];
        renderQuiz();
      } else if (q.type === 'mcq' && !quiz.checked[q.id] && ['1', '2', '3', '4'].includes(e.key)) {
        quiz.answers[q.id] = Number(e.key) - 1;
        renderQuiz();
      }
    });

    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchView(btn.getAttribute('data-nav'));
      });
    });

    document.getElementById('btn-reset-open').addEventListener('click', () => {
      openModal({
        title: 'Reset All Progress?',
        body: 'This will clear your saved question accuracy, chapter mastery bars, and best Part A Mock score.',
        confirmText: 'Reset Progress',
        confirmClass: 'bg-rose-600 hover:bg-rose-700',
        onConfirm: () => {
          state.stats = { totalAnswered: 0, totalCorrect: 0, bestMockScore: null, chapterStats: {} };
          saveStats();
          showToast('Progress reset.');
          if (state.view === 'dashboard') renderDashboard();
        }
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      applyView('dashboard');
    });
  </script>
</body>
</html>
